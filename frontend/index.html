<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <title>ELLA'S Store - Produtos que valem a pena</title>
    <meta name="description" content="Descobre produtos próprios e recomendações selecionadas na ELLA'S Store. Casa, tecnologia e muito mais, num só lugar.">
    <link rel="canonical" href="https://ellasstore.com/">

    <meta property="og:type" content="website">
    <meta property="og:title" content="ELLA'S Store - Produtos que valem a pena">
    <meta property="og:description" content="Descobre produtos próprios e recomendações selecionadas na ELLA'S Store.">
    <meta property="og:url" content="https://ellasstore.com/">
    <meta property="og:site_name" content="ELLA'S Store">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ELLA'S Store - Produtos que valem a pena">
    <meta name="twitter:description" content="Descobre produtos próprios e recomendações selecionadas na ELLA'S Store.">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ELLA'S Store",
        "url": "https://ellasstore.com"
    }
    </script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">ELLA'S</div>
        <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu de navegação" aria-expanded="false">☰</button>
        <nav aria-label="Navegação principal">
            <ul id="nav-list">
                <li><a href="index.html">Início</a></li>
                <li><a href="#" id="nav-gostos">Gostos</a></li>
                <li><a href="#" id="nav-carrinho" aria-label="Ver carrinho de compras">
                    Carrinho <span id="cart-count" aria-live="polite">0</span>
                </a></li>
                <li><a href="login.html" id="nav-login">Entrar</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Produtos em Destaque</h1>
        <div class="search-bar">
            <label for="search-input" class="sr-only">Procurar produtos</label>
            <input type="text" id="search-input" placeholder="🔎 Procurar produtos..." aria-label="Procurar produtos">
        </div>
        <div id="category-filters" class="category-filters" role="group" aria-label="Filtrar por categoria"></div>
        <div id="loading" role="status" aria-live="polite">A carregar produtos...</div>
        <div class="product-feed" id="product-feed"></div>
    </main>

    <div id="cart-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="cart-title">
        <div class="modal-content">
            <h2 id="cart-title">O Teu Carrinho</h2>
            <div id="cart-items"></div>
            <p>Total: <strong id="cart-total">0.00€</strong></p>
            <button id="checkout-btn">Finalizar Compra</button>
            <button id="close-cart" aria-label="Fechar carrinho">Fechar</button>
        </div>
    </div>

    <footer>
        <p>ELLA'S Store — Todos os direitos reservados</p>
        <p><a href="privacidade.html">Política de Privacidade</a> |
           <a href="termos.html">Termos e Condições</a> |
           <a href="cookies.html">Cookies</a> |
           <a href="divulgacao-afiliados.html">Divulgação de Afiliados</a></p>
    </footer>

    <script src="script.js"></script>
    <script src="analytics.js"></script>
    <script src="cookies.js"></script>
</body>
</html>
