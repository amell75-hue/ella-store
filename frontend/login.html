<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELLA'S - Entrar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">ELLA'S</div>
        <nav aria-label="Navegação principal"><ul><li><a href="index.html">Voltar à loja</a></li></ul></nav>
    </header>

    <main class="auth-container">
        <div class="auth-box">
            <h1>Entrar na tua conta</h1>
            <div id="auth-error" class="error-msg hidden"></div>

            <div id="form-login">
                <label for="login-email" class="sr-only">Email</label>
                <input type="email" id="login-email" placeholder="Email" autocomplete="email">
                <label for="login-password" class="sr-only">Password</label>
                <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
                <button id="btn-login">Entrar</button>
                <p>Não tens conta? <a href="#" id="show-register">Criar conta</a></p>
            </div>

            <div id="form-register" class="hidden">
                <label for="reg-name" class="sr-only">Nome completo</label>
                <input type="text" id="reg-name" placeholder="Nome completo">
                <label for="reg-email" class="sr-only">Email</label>
                <input type="email" id="reg-email" placeholder="Email">
                <label for="reg-password" class="sr-only">Password</label>
                <input type="password" id="reg-password" placeholder="Password (mín. 8 caracteres)">
                <button id="btn-register">Criar Conta</button>
                <p>Já tens conta? <a href="#" id="show-login">Entrar</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>ELLA'S Store — Todos os direitos reservados</p>
        <p><a href="privacidade.html">Política de Privacidade</a> |
           <a href="termos.html">Termos e Condições</a> |
           <a href="cookies.html">Cookies</a> |
           <a href="divulgacao-afiliados.html">Divulgação de Afiliados</a></p>
    </footer>

    <script>
    const API_URL = window.location.hostname === 'localhost'
        ? 'http://localhost:3000/api'
        : 'https://SUBSTITUIR-PELO-TEU-BACKEND-EM-PRODUCAO.com/api';

    function showError(msg) {
        const el = document.getElementById('auth-error');
        el.textContent = msg;
        el.classList.remove('hidden');
    }

    document.getElementById('show-register').addEventListener('click', e => {
        e.preventDefault();
        document.getElementById('form-login').classList.add('hidden');
        document.getElementById('form-register').classList.remove('hidden');
        document.getElementById('auth-error').classList.add('hidden');
    });
    document.getElementById('show-login').addEventListener('click', e => {
        e.preventDefault();
        document.getElementById('form-register').classList.add('hidden');
        document.getElementById('form-login').classList.remove('hidden');
        document.getElementById('auth-error').classList.add('hidden');
    });

    async function fazerLogin(email, password) {
        const res = await fetch(`${API_URL}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
            localStorage.setItem('ella_token', data.token);
            localStorage.setItem('ella_user',  JSON.stringify(data.user));
            window.location.href = data.user.role === 'admin' ? 'admin.html' : 'index.html';
        } else {
            showError(data.error || 'Erro no login');
        }
    }

    document.getElementById('btn-login').addEventListener('click', async () => {
        const email    = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        if (!email || !password) {
            showError('Preenche todos os campos.');
            return;
        }

        try {
            await fazerLogin(email, password);
        } catch {
            showError('Erro de ligação ao servidor');
        }
    });

    document.getElementById('btn-register').addEventListener('click', async () => {
        const name     = document.getElementById('reg-name').value.trim();
        const email    = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;

        if (!name || !email || !password) {
            showError('Preenche todos os campos.');
            return;
        }
        if (password.length < 8) {
            showError('Password deve ter mínimo 8 caracteres.');
            return;
        }

        try {
            const res = await fetch(`${API_URL}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            const data = await res.json();
            if (res.ok) {
                // Login automatico depois do registo, sem pedir para o
                // utilizador escrever tudo outra vez.
                await fazerLogin(email, password);
            } else {
                showError(data.error || 'Erro no registo');
            }
        } catch {
            showError('Erro de ligação ao servidor');
        }
    });
    </script>
    <script src="cookies.js"></script>
</body>
</html>
